version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm install
  build:
    commands:
      - echo Building Node.js backend...
      - npm run build || echo "No build script found, skipping..."
  post_build:
    commands:
      - echo Packaging for Elastic Beanstalk...
      - zip -r backend.zip * .[^.]*

artifacts:
  files:
    - backend.zip
